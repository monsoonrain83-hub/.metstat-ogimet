name: metstat-ogimet-fetch
on:
  workflow_dispatch:
    inputs:
      nshards:
        description: "تعداد شارد موازی (هر شارد ≤۵٫۵ ساعت). پیشنهاد: ۱۲"
        default: "12"
      limit:
        description: "آزمایشی: فقط N کار اول هر شارد (۰ = همه). برای اولین بار 10 بگذار"
        default: "0"
      prev_run:
        description: "شمارهٔ اجرای قبلی (برای ادامه؛ خالی = از اول)"
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: python3 -c "import json;print('shards='+json.dumps(list(range(int('${{ inputs.nshards }}')))))" >> $GITHUB_OUTPUT
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas lxml html5lib beautifulsoup4
      - name: دانلود نتایج اجرای قبلی (اختیاری)
        if: ${{ inputs.prev_run != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ogimet-shard-*
          path: prev
          run-id: ${{ inputs.prev_run }}
          github-token: ${{ github.token }}
      - name: fetch
        run: |
          mkdir -p out prev
          python3 ogimet_fetch.py --jobs jobs.json --shard ${{ matrix.shard }} --nshards ${{ inputs.nshards }} --out out --budget 325 --limit ${{ inputs.limit }} --skip $(find prev -name 'done_*.txt' | tr '\n' ' ')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ogimet-shard-${{ matrix.shard }}
          retention-days: 2
          path: out/
  aggregate:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ogimet-shard-*
          path: all
      - name: نتایج اجرای قبلی
        if: ${{ inputs.prev_run != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ogimet-shard-*
          path: prev
          run-id: ${{ inputs.prev_run }}
          github-token: ${{ github.token }}
      - run: |
          test -f jcal.py || { echo 'jcal.py در ریشهٔ مخزن نیست!'; exit 1; }
          mkdir -p prev
          python3 ogimet_aggregate.py all prev --out monthly.csv
          cat all/*/done_*.txt | awk '{print $2}' | sort | uniq -c
      - uses: actions/upload-artifact@v4
        with:
          name: ogimet-monthly
          retention-days: 2
          path: monthly.csv
